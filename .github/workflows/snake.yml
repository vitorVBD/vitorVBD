# Gera a snake das contribuições e publica os SVGs na branch `output`.
# A action grava dist/github-snake.svg e dist/github-snake-dark.svg
# e o passo seguinte publica o conteúdo de dist/ na raiz da branch.
# URLs finais:
#   https://raw.githubusercontent.com/vitorVBD/vitorVBD/output/github-snake.svg
#   https://raw.githubusercontent.com/vitorVBD/vitorVBD/output/github-snake-dark.svg
# Requer permissão de escrita em Actions (Settings → Actions → General →
# Workflow permissions → Read and write). Rode uma vez em workflow_dispatch.

name: Generate Snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

concurrency:
  group: snake
  cancel-in-progress: true

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate contribution snake SVGs
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: vitorVBD
          github_token: ${{ secrets.SNAKE_TOKEN }}
          outputs: |
            dist/github-snake.svg?palette=github-light&color_snake=#9F1239&color_dots=#f4f4f5,#fecdd3,#FF2D3A,#7C3AED,#4C1D95
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#FFFFFF&color_dots=#2A1538,#5B2170,#7C3AED,#FF2D3A,#FFFFFF

      - name: Bake colors into each cell
        run: python .github/scripts/paint-snake.py dist/github-snake.svg dist/github-snake-dark.svg

      - name: Fail if the snake is still uncolored
        run: |
          python - << 'PY'
          import re
          from pathlib import Path
          for name in ("dist/github-snake.svg", "dist/github-snake-dark.svg"):
              text = Path(name).read_text(encoding="utf-8")
              root = re.search(r":root\{[^}]+\}", text)
              fills = len(re.findall(r'fill="#[0-9A-Fa-f]{3,8}"', text))
              print(f"{name}: {fills} painted cells")
              print(root.group(0) if root else "no :root")
              if fills < 50:
                  raise SystemExit(f"{name} was not painted")
          PY

      - name: Publish SVGs to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
