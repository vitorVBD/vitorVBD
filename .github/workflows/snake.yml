# Gera a snake das contribuições e publica os SVGs na branch `output`.
# A action grava dist/github-snake.svg e dist/github-snake-dark.svg
# e o passo seguinte publica o conteúdo de dist/ na raiz da branch.
# URLs finais:
#   https://raw.githubusercontent.com/vitorVBD/vitorVBD/output/github-snake.svg
#   https://raw.githubusercontent.com/vitorVBD/vitorVBD/output/github-snake-dark.svg
# Requer permissão de escrita em Actions (Settings → Actions → General →
# Workflow permissions → Read and write). Rode uma vez em workflow_dispatch.

name: Generate Snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

concurrency:
  group: snake
  cancel-in-progress: true

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Generate contribution snake SVGs
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: vitorVBD
          outputs: |
            dist/github-snake.svg?palette=github-light&color_snake=#9D174D&color_dots=#ebedf0,#fbcfe8,#FF4ECD,#B026FF,#FF2BD6
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#FF4ECD&color_dots=#2a1538,#6b2157,#FF4ECD,#B026FF,#FF2BD6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish SVGs to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
